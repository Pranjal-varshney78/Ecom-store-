<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop | EcomStore</title>
  <link rel="stylesheet" href="store.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-brand">
      <a href="index.html"><img src="Varshneylogo.jpg" alt="Pro-EcomStore" class="logo-image"></a>
      <h1>EcomStore</h1>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="shop.html" class="nav-link active">Shop</a>
      <a href="cart.html" class="nav-link">🛒 Cart</a>
      <a href="login.html" id="login-link" class="nav-link">👤 Login</a>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">🌙</button>
    </nav>
  </header>

  <main class="shop-main">
    <h2>Explore Our Products</h2>

    <div class="controls-bar">
      <div class="control">
        <label for="category-filter">Category</label>
        <select id="category-filter">
          <option value="All">All</option>
          <option value="Clothes">Clothes</option>
          <option value="Electronics">Electronics</option>
          <option value="Accessories">Accessories</option>
          <option value="Footwear">Footwear</option>
        </select>
      </div>

      <div class="control">
        <label for="price-filter">Sort</label>
        <select id="price-filter">
          <option value="default">Default</option>
          <option value="low-high">Price: Low → High</option>
          <option value="high-low">Price: High → Low</option>
        </select>
      </div>

      <div class="control search-control">
        <label for="search-box">Search</label>
        <input id="search-box" type="search" placeholder="Search products..." />
      </div>
    </div>

    <div id="product-grid" class="product-grid" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 EcomStore</p>
  </footer>

  <script src="store.js"></script>
</body>
</html>
